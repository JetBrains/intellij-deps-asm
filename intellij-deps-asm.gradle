//[JB] The script renames ASM packages using fixed prefixes, merges modules into "fat" artifacts, and publishes them.

buildscript {
  repositories { maven { url = uri("https://cache-redirector.jetbrains.com/maven-central") } }
  repositories { gradlePluginPortal() }
  dependencies { classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.4.2' }
}

apply plugin: com.github.jengelman.gradle.plugins.shadow.ShadowPlugin
apply plugin: 'maven-publish'

configure(project) {
  def moduleNames = (project.findProperty('intellij.asm.modules') ?: 'commons,tree,analysis,util') as String
  def modules = ['asm'] + (moduleNames.split(',').findAll { !it.isEmpty() }.collect { "asm-${it}" } as List<String>)

  project.ext.jarFiles = []
  project.ext.srcDirs = []
  for (module in modules) {
    // Referencing the task output makes packaging depend on building the module JAR.
    project.ext.jarFiles += project(":${module}").tasks.named('jar', Jar).flatMap { it.archiveFile }

    def srcDir = file("${module}/src/main/java")
    assert srcDir.isDirectory(): "source directory '${srcDir}' doesn't seem to exist"
    project.ext.srcDirs += srcDir
  }

  println "modules: ${modules}"
  println "version: ${project.version}"
}

def variants = [
  base: [artifactId: 'asm-all', taskPrefix: 'base', pkgPrefix: 'org.jetbrains'],
  capture: [artifactId: 'asm-all-capture', taskPrefix: 'capture', pkgPrefix: 'org.jetbrains.capture'],
  coverage: [artifactId: 'asm-all-coverage', taskPrefix: 'coverage', pkgPrefix: 'org.jetbrains.coverage']
]

variants.each { publicationName, variant ->
  def pkgPrefix = variant.pkgPrefix

  def fatJar = tasks.register("${variant.taskPrefix}Jar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    destinationDirectory = file("$projectDir")
    archiveFileName = "${variant.artifactId}-${project.version}.jar"
    from project.ext.jarFiles.collect { it.map { zipTree(it) } }
    exclude 'module-info.class'
    relocate 'org.objectweb.asm', "${pkgPrefix}.org.objectweb.asm"
  }

  def fatSources = tasks.register("${variant.taskPrefix}Sources", Jar) {
    destinationDirectory = file("${projectDir}")
    archiveFileName = "${variant.artifactId}-${project.version}-sources.jar"
    archiveClassifier = 'sources'
    from project.ext.srcDirs as File[]
    filter { it.replace('org.objectweb.asm', "${pkgPrefix}.org.objectweb.asm") }
    into pkgPrefix.replace('.', '/')
  }

  publishing.publications.create(publicationName, MavenPublication) {
    groupId = 'org.jetbrains.intellij.deps'
    artifactId = variant.artifactId
    artifact fatJar
    artifact fatSources
  }

  tasks.named('assemble') {
    dependsOn fatJar, fatSources
  }
}

publishing {
  repositories {
    maven {
      name = 'space'
      url = 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies'
      credentials {
        username = System.getenv('INTELLIJ_DEPENDENCIES_BOT')
        password = System.getenv('INTELLIJ_DEPENDENCIES_TOKEN')
      }
    }
  }
}

allprojects {
  tasks.withType(Sign).configureEach {
    enabled = false
  }
  tasks.withType(PublishToMavenRepository).configureEach {
    // skipping publications/repositories inherited from the upstream build
    onlyIf { publication.name in variants.keySet() && repository.name == 'space' }
  }
}
